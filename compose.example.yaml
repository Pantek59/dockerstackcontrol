# Example compose deployment for stackctl.
#
# Before first use:
#   1. copy this file to compose.yaml
#   2. put your configuration next to it as config.yaml (see config.example.yaml)
#   3. create a .env file with the secrets (all values base64):
#        STACKCTL_OIDC_SECRET=<client secret of your OIDC client>
#        STACKCTL_HASH_KEY=<openssl rand -base64 32>
#        STACKCTL_BLOCK_KEY=<openssl rand -base64 32>
#
# The service is meant to run behind a reverse proxy that terminates TLS and
# points https://<your-domain>/ at port 8080 (see README).

services:
  stackctl:
    build: .
    image: stackctl:latest
    container_name: stackctl
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      # Access to the Docker daemon. This is a privilege boundary:
      # anything with this socket controls the host. Keep the container
      # isolated and treat the token/secret environment as sensitive.
      - /var/run/docker.sock:/var/run/docker.sock
      # Configuration, loaded fresh again on SIGHUP (docker compose kill -s HUP stackctl).
      - ./config.yaml:/etc/stackctl/config.yaml:ro
    environment:
      STACKCTL_OIDC_SECRET: ${STACKCTL_OIDC_SECRET}
      STACKCTL_HASH_KEY: ${STACKCTL_HASH_KEY}
      STACKCTL_BLOCK_KEY: ${STACKCTL_BLOCK_KEY}
    # Give the non-root container user read/write access to the socket by
    # adding the host docker group. Find the GID on the host with:
    #   getent group docker | cut -d: -f3
    group_add:
      - "${STACKCTL_DOCKER_GID:-988}"
